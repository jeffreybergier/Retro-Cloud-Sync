name: Build macOS and iOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      BUILD_IMAGE: ghcr.io/jeffreybergier/altivec-intelligence@sha256:c3a8181f6f8fdd4d87857bbfece5d6b9068cac6575662879cd7c2685bae550a9
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Validate release tag
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a three-part version tag, such as v1.0.0: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out tagged source and dependencies
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify the checked-out commit
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_sha"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Pull pinned build image
        run: docker pull "$BUILD_IMAGE"

      - name: Check tag against configured app and daemon versions
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            -e RELEASE_TAG \
            -v "$GITHUB_WORKSPACE:/repo/user" \
            -w /repo/user \
            "$BUILD_IMAGE" \
            -lc 'altivec-release ci-env "$RELEASE_TAG"' > release.env
          cat release.env >> "$GITHUB_ENV"
          cat release.env

      - name: Fetch and verify Apple SDK archives
        env:
          ALTIVEC_SDK_MACOS_105_URL: ${{ secrets.ALTIVEC_SDK_MACOS_105_URL }}
          ALTIVEC_SDK_MACOS_113_URL: ${{ secrets.ALTIVEC_SDK_MACOS_113_URL }}
          ALTIVEC_SDK_IPHONEOS_84_URL: ${{ secrets.ALTIVEC_SDK_IPHONEOS_84_URL }}
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/.altivec-sdk"
          mkdir -p "$archive_dir"
          chmod 0700 "$archive_dir"
          for archive_input in \
              'ALTIVEC_SDK_MACOS_105_URL|MacOSX10.5.sdk.tar.xz' \
              'ALTIVEC_SDK_MACOS_113_URL|MacOSX11.3.sdk.tar.xz' \
              'ALTIVEC_SDK_IPHONEOS_84_URL|iPhoneOS8.4.sdk.tar.gz'; do
            IFS='|' read -r secret_name filename <<< "$archive_input"
            archive_url="${!secret_name:-}"
            if [[ ! "$archive_url" =~ ^https://[^[:space:]]+$ ]]; then
              echo "${secret_name} must be an HTTPS repository secret." >&2
              exit 1
            fi
            temporary="$archive_dir/$filename.part"
            curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 30 --output "$temporary" "$archive_url"
            mv "$temporary" "$archive_dir/$filename"
          done
          docker run --rm \
            --entrypoint altivec-sdk \
            -e ALTIVEC_SDK_ARCHIVE_DIR=/altivec-sdk \
            -v "$archive_dir:/altivec-sdk:ro" \
            "$BUILD_IMAGE" preflight

      - name: Build and stage the Mac ZIP and iOS package
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            -e IS_SANDBOX=1 \
            -e ALTIVEC_SDK_ARCHIVE_DIR=/altivec-sdk \
            -e RELEASE_VERSION \
            -v "$RUNNER_TEMP/.altivec-sdk:/altivec-sdk:ro" \
            --mount type=volume,target=/osxcross/legacy/target/SDK \
            --mount type=volume,target=/osxcross/modern/SDK \
            -v "$GITHUB_WORKSPACE:/repo/user" \
            -w /repo/user \
            "$BUILD_IMAGE" \
            -lc 'altivec-sdk install && altivec-release build && altivec-release stage "$RELEASE_VERSION"'

      - name: Validate release assets
        run: |
          set -euo pipefail
          python3 source/make/scripts/validate-release.py "$RELEASE_VERSION" dist
          sha256sum "dist/Retro-Cloud-Sync-${RELEASE_VERSION}-macOS.zip" \
            "dist/Retro-Cloud-Sync-${RELEASE_VERSION}-iOS-rootful.deb"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag --target "$RELEASE_SHA" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/Retro-Cloud-Sync-${RELEASE_VERSION}-macOS.zip" \
            "dist/Retro-Cloud-Sync-${RELEASE_VERSION}-iOS-rootful.deb" --clobber
