name: Linux tests

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      BUILD_IMAGE: ghcr.io/jeffreybergier/altivec-intelligence:latest

    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull latest build image
        run: docker pull "$BUILD_IMAGE"

      - name: Run offline Linux tests
        run: |
          docker run --rm --network none \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/repo/user" \
            -w /repo/user \
            "$BUILD_IMAGE" \
            -lc 'make test-host'
